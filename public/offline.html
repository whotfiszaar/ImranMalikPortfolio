<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Imran Malik Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0908;
      color: #f2ecdf;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card { max-width: 420px; }
    .mark {
      width: 72px; height: 72px;
      border: 2px solid #c9a24b;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      color: #c9a24b;
      font-size: 28px; font-weight: bold;
      letter-spacing: 2px;
    }
    h1 { color: #e6cd8a; font-size: 1.8rem; font-weight: 600; margin-bottom: 1rem; }
    p { color: #a89f8a; line-height: 1.7; font-family: sans-serif; font-size: 0.95rem; }
    a {
      display: inline-block;
      margin-top: 2rem;
      color: #0a0908;
      background: #c9a24b;
      text-decoration: none;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      font-family: sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">IM</div>
    <h1>You are offline</h1>
    <p>This portfolio needs a connection to load fresh content. Please reconnect and try again. Previously visited pages may still be available.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
